name: Crypto Bot Auto Run

on:
  schedule:
    - cron: '0 * * * *' # दर तासाला आपोआप रन होईल
  workflow_dispatch: # मॅन्युअली रन करण्यासाठी

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Crypto Bot
        run: python bot.py
        
